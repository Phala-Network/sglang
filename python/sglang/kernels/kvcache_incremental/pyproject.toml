[build-system]
requires = ["scikit-build-core>=0.10", "torch==2.13.0", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "phala-kimi-k3-kvcache-incremental"
version = "0.1.0"
description = "Focused registered-host-pointer and KV transfer extension for Kimi K3"
requires-python = ">=3.10"
dependencies = ["torch==2.13.0"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.py-api = "cp310"
wheel.packages = ["python/phala_kvcache_incremental"]
wheel.license-files = []
