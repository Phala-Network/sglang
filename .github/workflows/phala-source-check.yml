name: Phala v0.5.23 source checks

on:
  pull_request:
    paths:
      - 'python/sglang/**'
      - 'test/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phala-v0523-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the fixed official base
        run: git fetch --no-tags --depth=1 origin 297e54fd105e974cdf401e5b4d20253a22c16f90
      - name: Check changed-source syntax and whitespace
        shell: bash
        run: |
          set -eu
          git diff --check 297e54fd105e974cdf401e5b4d20253a22c16f90 HEAD
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess

          base = '297e54fd105e974cdf401e5b4d20253a22c16f90'
          names = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=ACMR', '-z',
              base, 'HEAD', '--', '*.py',
          ]).decode().split('\0')
          names = [name for name in names if name]
          for name in names:
              ast.parse(Path(name).read_text(encoding='utf-8'), filename=name)
          print(json.dumps({'python_files': len(names), 'scope': 'source syntax only'}))
          PY

  release-bf16-q:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/v0.5.23-bf16-q-publish-recovery'
    needs: source-static
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RELEASE_TAG: phala-v0.5.23-2
      ENGINE_SHA: 1c9a64c947af8fd05cf2a813111d919e3e682146
      BASE_IMAGE: ghcr.io/phala-network/sglang:phala-v0.5.23-1@sha256:fdf817319f25ec54ce6e84113337117f24f2dbf694b8e519e017bcbed86bc9e6
      IMAGE: ghcr.io/phala-network/sglang:phala-v0.5.23-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: refs/tags/phala-v0.5.23-2
      - name: Verify source release and patch inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$ENGINE_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and (.isDraft or .isPrerelease | not)'
          inputs="$RUNNER_TEMP/source-inputs.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern source-inputs.json --output "$inputs"
          jq -e --arg engine "$ENGINE_SHA" '.engine_commit == $engine' "$inputs"
          patches_commit=$(jq -er '.serving_patches_commit | select(test("^[0-9a-f]{40}$"))' "$inputs")
          gh api "repos/Phala-Network/sglang-serving-patches/contents/versions/v0.5.23/stack.json?ref=$patches_commit" --jq '.content | @base64d' |
            jq -e --arg engine "$ENGINE_SHA" '.engine.commit == $engine'
          printf 'PATCHES_COMMIT=%s\n' "$patches_commit" >> "$GITHUB_ENV"
      - name: Make room for the pinned CUDA base
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the release image
        shell: bash
        run: |
          set -eu
          docker pull "$BASE_IMAGE"
          docker build --pull=false --network=none \
            --file docker/phala/v0.5.23/Dockerfile.bf16-q \
            --build-arg "ENGINE_REVISION=$ENGINE_SHA" \
            --build-arg "PATCHES_REVISION=$PATCHES_COMMIT" \
            --iidfile "$RUNNER_TEMP/image-id" --tag "$IMAGE" .
      - name: Verify installed image and executable interfaces
        shell: bash
        run: |
          set -eu
          image_id=$(cat "$RUNNER_TEMP/image-id")
          run=(docker run --rm --pull=never --network=none --env NVIDIA_VISIBLE_DEVICES=none)
          "${run[@]}" --entrypoint hf "$image_id" --help > /dev/null
          "${run[@]}" --entrypoint hf "$image_id" download --help > /dev/null
          "${run[@]}" --entrypoint sglang "$image_id" serve --help > /dev/null
          "${run[@]}" -i --entrypoint python "$image_id" - <<'PY'
          import hashlib
          import importlib.metadata
          import importlib.util
          import inspect
          import json
          from pathlib import Path

          from flashinfer.artifacts import ArtifactPath
          from flashinfer.decode import trtllm_batch_decode_with_kv_cache

          sglang = importlib.util.find_spec("sglang")
          path = Path(sglang.origin).parent / "srt/layers/attention/trtllm_mha_backend.py"
          assert str(path) == "/sgl-workspace/sglang/python/sglang/srt/layers/attention/trtllm_mha_backend.py"
          source = path.read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          assert digest == "26fd601f715d768a1c49b2202779d93ea47cd46cf22f17fbd9689696870905b8"
          compile(source, str(path), "exec")
          assert importlib.metadata.version("sglang") == "0.5.23"
          assert importlib.metadata.version("flashinfer-python") == "0.7.2"
          assert ArtifactPath.TRTLLM_GEN_FMHA == "2d6a5a029eefcc388ec0ceb87efb55d8bcce5c3c/fmha/trtllm-gen/"
          params = inspect.signature(trtllm_batch_decode_with_kv_cache).parameters
          assert {"query", "kv_cache", "bmm1_scale", "bmm2_scale", "out", "q_len_per_req", "bf16q_fp8kv_transform_mode", "multi_ctas_kv_counter_buffer"} <= params.keys()
          print(json.dumps({"backend_sha256": digest, "flashinfer": "0.7.2", "generation_abi": "pass"}))
          PY
          echo 'hf help, hf download help and sglang serve help passed.'
      - name: Export verified image config and the single added layer
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_ID=$(cat "$RUNNER_TEMP/image-id")
          export OUTPUT_DIR="$RUNNER_TEMP/bf16-q-image-delta"
          docker image save "$IMAGE" | python3 -c '
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tarfile

          def digest(data):
              return "sha256:" + hashlib.sha256(data).hexdigest()

          archive_files = {}
          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|*") as archive:
              for member in archive:
                  if member.isfile() and member.size <= 2 * 1024**2:
                      archive_files[member.name.removeprefix("./")] = archive.extractfile(member).read()
          manifest, = json.loads(archive_files["manifest.json"])
          assert manifest["RepoTags"] == [os.environ["IMAGE"]], manifest["RepoTags"]
          image_config = archive_files[manifest["Config"]]
          assert digest(image_config) == os.environ["IMAGE_ID"]
          config = json.loads(image_config)
          layers = config["rootfs"]["diff_ids"]
          assert len(layers) == len(manifest["Layers"]) == 72
          layer = archive_files[manifest["Layers"][-1]]
          if layer.startswith(bytes((31, 139))):
              layer = gzip.decompress(layer)
          assert digest(layer) == layers[-1]
          assert config["config"]["Labels"]["org.opencontainers.image.revision"] == os.environ["ENGINE_SHA"]
          output = Path(os.environ["OUTPUT_DIR"])
          output.mkdir()
          (output / "config.json").write_bytes(image_config)
          (output / "layer.tar.gz").write_bytes(gzip.compress(layer, mtime=0))
          print(json.dumps({"tested_image_config": digest(image_config), "layer_diff_id": layers[-1]}))
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phala-v0.5.23-2-image-delta
          path: ${{ runner.temp }}/bf16-q-image-delta/
          if-no-files-found: error
          retention-days: 1
